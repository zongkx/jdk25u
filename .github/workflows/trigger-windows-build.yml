name: Pure Windows OpenJDK Build

on:
  workflow_dispatch: # 支持手动点击按钮触发

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 1. 签出你魔改后的本地仓库代码（会带上你修改的 C++ 源码）
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 用标准的独立社区 Action 搭建 Cygwin 环境，并一步到位装齐所有构建依赖
      - name: Set up Cygwin
        uses: egor-tensin/setup-cygwin@v4
        with:
          platform: x64
          packages: make zip unzip git autoconf

      # 3. 配置 Boot JDK (编译 JDK 25 必须的引导 JDK 24)
      - name: Setup Boot JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      # 4. 关键点：在 cmd 环境下激活微软 VS2022 的 C++ 编译工具链，并强行灌入系统全局变量
      - name: Initialize MSVC Compiler
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set >> "%GITHUB_ENV%"

      # 5. 执行 OpenJDK 的环境配置（平铺数组版，彻底免疫 Windows \r 换行符断裂干扰）
      - name: OpenJDK Configure
        shell: bash
        run: |
          set -e
          
          # 转换为 Cygwin 兼容的绝对路径
          BOOT_JDK_PATH=$(cygpath -u "$JAVA_HOME")
          echo "==== 当前使用的 Boot JDK 路径为: $BOOT_JDK_PATH ===="
          
          # 使用 Bash 数组包裹参数，彻底废弃反斜杠折行，防止 \r 导致命令断裂
          CONF_ARGS=(
            --with-debug-level=release
            --with-jvm-variants=server
            --with-boot-jdk="$BOOT_JDK_PATH"
            --openjdk-target=x86_64-unknown-cygwin
            --disable-hotspot-gtest
          )
          
          # 运行配置脚本
          bash configure "${CONF_ARGS[@]}" || {
            echo "==== 编译配置失败 ===="
            if [ -f config.log ]; then 
              echo "==== 倾倒配置错误日志 config.log ===="
              cat config.log
            fi
            exit 1
          }

      # 6. 开始核心编译（只编译核心镜像，不编译测试套件）
      - name: Run Make Images
        shell: bash
        run: |
          make images

      # 7. 符号表擦除（加固你的 custom jvm.dll）
      - name: Strip JVM Symbols
        shell: bash
        run: |
          TARGET_DLL=$(find build/*/images/jdk/bin/server/ -name "jvm.dll")
          if [ -f "$TARGET_DLL" ]; then
            strip "$TARGET_DLL"
            echo "==== jvm.dll 符号表抹除成功 ===="
          fi

      # 8. 强行就地打包最终生成的编译产物
      - name: Zip Result JDK
        shell: bash
        run: |
          cd build/*/images
          zip -r ../../../my-custom-jdk-windows-x64.zip jdk
          echo "==== 专属加固版 Windows JDK 压缩成功 ===="

      # 9. 使用标准的 GitHub Action 把 ZIP 吐到首页最下方（已修正 path 名字的一致性）
      - name: Upload JDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-custom-jdk-windows-x64
          path: my-custom-jdk-windows-x64.zip
          retention-days: 7
