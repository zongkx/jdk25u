name: Trigger Custom Windows Build

on:
  workflow_dispatch:

jobs:
  call-official-windows-build:
    uses: ./.github/workflows/build-windows.yml # 触发刚才改好的这份官方规范文件
    with:
      platform: windows-x64
      runs-on: windows-2022
      debug-levels: '[ "release" ]'  # 强行只跑 release，不编译 debug 节省一半时间
      make-target: 'images'           # 💥 关键：目标必须填 images，代表只编译干净的绿色 JDK 包
      msvc-toolset-version: '14.38' 
      msvc-toolset-architecture: '14.38.33130'
