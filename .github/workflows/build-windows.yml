name: 'Build (windows)'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      extra-conf-options:
        required: false
        type: string
      make-target:
        required: false
        type: string
        default: 'product-bundles' # 💥【修改】移除原先的 test-bundles 目标
      debug-levels:
        required: false
        type: string
        default: '[ "debug", "release" ]'
      msvc-toolset-version:
        required: true
        type: string
      msvc-toolset-architecture:
        required: true
        type: string
      configure-arguments:
        required: false
        type: string
      make-arguments:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

env:
  # These are needed to make the MSYS2 bash work properly
  MSYS2_PATH_TYPE: minimal
  CHERE_INVOKING: 1

jobs:
  build-windows:
    name: build
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        debug-level: ${{ fromJSON(inputs.debug-levels) }}
        include:
          - debug-level: debug
            flags: --with-debug-level=fastdebug
            suffix: -debug
          # 💥【修正】显式补齐 release 的矩阵 flags 参数，防止变量为空导致编译参数错误
          - debug-level: release
            flags: --with-debug-level=release
            suffix: ''

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v6

      - name: 'Get MSYS2'
        uses: ./.github/actions/get-msys2

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: windows-x64

      # 💥【核心删减】彻底删除原先报错的 Get JTReg 和 Get GTest 步骤

      - name: 'Check toolchain installed'
        id: toolchain-check
        run: |
          set +e
          '/c/Program Files/Microsoft Visual Studio/2022/Enterprise/vc/auxiliary/build/vcvars64.bat' -vcvars_ver=${{ inputs.msvc-toolset-version }}
          if [ $? -eq 0 ]; then
            echo "Toolchain is already installed"
            echo "toolchain-installed=true" >> $GITHUB_OUTPUT
          else
            echo "Toolchain is not yet installed"
            echo "toolchain-installed=false" >> $GITHUB_OUTPUT
          fi

      - name: 'Install toolchain and dependencies'
        run: |
          # Run Visual Studio Installer
          '/c/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe' \
            modify --quiet --installPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' \
            --add Microsoft.VisualStudio.Component.VC.${{ inputs.msvc-toolset-version }}.${{ inputs.msvc-toolset-architecture }}
        if: steps.toolchain-check.outputs.toolchain-installed != 'true'

      # 💥【核心修正】把已经删除的 jtreg/gtest 的路径参数从 bash configure 中安全剥离，并加入 --disable-hotspot-gtest 彻底停用测试
      - name: 'Configure'
        run: >
          bash configure
          --with-conf-name=${{ inputs.platform }}
          ${{ matrix.flags }}
          --with-version-opt=${GITHUB_ACTOR}-${GITHUB_SHA}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-msvc-toolset-version=${{ inputs.msvc-toolset-version }}
          --with-jmod-compress=zip-1
          --disable-hotspot-gtest
          ${{ inputs.extra-conf-options }} ${{ inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)
        env:
          PATH: ''
        shell: env /usr/bin/bash --login -eo pipefail {0}
        if: ${{ inputs.dry-run == false }}

      - name: 'Build'
        id: build
        uses: ./.github/actions/do-build
        with:
          make-target: '${{ inputs.make-target }} ${{ inputs.make-arguments }}'
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'
        if: ${{ inputs.dry-run == false }}

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'
        if: ${{ inputs.dry-run == false }}

      # 💥【追加步骤 1】将你修改后的 jvm.dll 符号表抹除（安全加固）
      - name: 'Strip JVM DLL Symbols'
        run: |
          TARGET_DLL=$(find build/*/images/jdk/bin/server/ -name "jvm.dll")
          if [ -f "$TARGET_DLL" ]; then
            strip "$TARGET_DLL"
            echo "==== jvm.dll 安全加固成功 ===="
          fi
        if: ${{ inputs.dry-run == false }}

      # 💥【追加步骤 2】就地把编译出的完整绿色 JDK 目录压缩成标准的 ZIP 格式
      - name: 'Force Zip Custom JDK'
        run: |
          cd build/*/images
          zip -r ../../../custom-jdk-windows-x64.zip jdk
          echo "==== 定制 Windows JDK 压缩完成 ===="
        if: ${{ inputs.dry-run == false }}

      # 💥【追加步骤 3】使用 GitHub 官方通用的 upload-artifact 动作把压缩包吐到首页最下方供你下载
      - name: 'Force Upload JDK to Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: custom-openjdk25-windows-x64-${{ matrix.debug-level }}
          path: custom-jdk-windows-x64.zip
          retention-days: 7
        if: ${{ inputs.dry-run == false }}
